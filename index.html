      --sp-5: 20px;

    body {

      padding: var(--sp-3) 0;
      position: sticky;
      top: 0;
      z-index: 100;
    }

    .header-inner {

      align-items: center;
      gap: var(--sp-4);
    }

    .logo {
      display: flex;
      align-items: center;
      gap: var(--sp-2);
      color: var(--color-white);

      font-weight: 800;

      gap: var(--sp-2);

      font-size: 15px;
    }

    .search-sep { color: var(--color-neutral-600); }

    .search-meta {
      font-size: 13px;
      color: var(--color-neutral-600);
    }

    .btn-edit {
      margin-left: auto;
      border: 1.5px solid var(--brand-primary-3);
      color: var(--brand-primary-3);
      background: transparent;
      border-radius: var(--r-2xl);
      padding: var(--sp-1) var(--sp-3);
      font-size: 12px;
      font-weight: 700;
      cursor: pointer;
      white-space: nowrap;
    }

    .btn-edit:hover { background: var(--brand-primary-1); }

    /* ─── Main ─── */
    .page-body { padding: var(--sp-5) 0 var(--sp-8); }

    .results-header {
      display: flex;
      align-items: baseline;
      gap: var(--sp-2);
      margin-bottom: var(--sp-4);
    }

    .results-count {
      font-size: 13px;
      color: var(--color-neutral-600);
    }

    .flight-card {
      background: var(--color-white);
      border-radius: var(--r-2xl);
      box-shadow: var(--shadow-line);
      margin-bottom: var(--sp-3);
      overflow: hidden;
      cursor: pointer;
      transition: box-shadow 0.2s ease, transform 0.15s ease;

    .flight-card:hover { box-shadow: var(--shadow-line-hover); transform: translateY(-1px); }
    .flight-card:active { transform: scale(0.995); }

    .flight-card.-suggested {

      border: 1.5px solid var(--color-neutral-400);
    }

    .flight-card.-suggested:hover {

      border-color: var(--color-neutral-400);

      gap: 4px;
      font-size: 11px;
      font-weight: 600;
      color: var(--color-neutral-600);
      background: var(--color-neutral-100);
      border-bottom: 1px solid var(--color-neutral-200);
      padding: 5px var(--sp-3);

      height: 6px;
      border-radius: 50%;

    .t-line {

      height: 1px;
      background: var(--color-neutral-400);
      position: relative;

    .t-stop-dot {
      width: 5px;
      height: 5px;
      border-radius: 50%;
      background: var(--color-neutral-600);
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);

      padding: 2px var(--sp-2);

      gap: var(--sp-2);

      gap: 4px;
      font-size: 12px;

    .loyalty-line {

      font-size: 11px;
      color: var(--color-neutral-600);

      align-items: flex-end;
      gap: var(--sp-1);
      flex-shrink: 0;

      padding-bottom: var(--sp-1);

      padding: 3px var(--sp-3);
      font-size: 12px;
      font-weight: 600;
      color: var(--color-neutral-700);
      background: var(--color-white);

      transition: all 0.15s;

    .tip-content {

      background: var(--color-neutral-100);
      border-radius: var(--r-md);
      padding: var(--sp-2) var(--sp-3);
      animation: fadeIn 0.2s ease;
    }

    @keyframes fadeIn { from { opacity: 0; transform: translateY(4px); } to { opacity: 1; transform: translateY(0); } }

    .tip-content-title {
      font-size: 12px;
      font-weight: 700;
      color: var(--color-neutral-800);
      margin-bottom: 2px;

    .tip-content-body {

      color: var(--color-neutral-700);
      line-height: 1.4;

    .tip-cta {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      margin-top: var(--sp-1);
      font-size: 12px;
      font-weight: 700;
      color: var(--brand-primary-3);
      background: none;
      border: none;
      cursor: pointer;
      padding: 0;

    /* ─── Responsive ─── */

        align-items: stretch;
        gap: var(--sp-3);

      .price-box {

        align-items: center;
        justify-content: space-between;

      }

      .eva-3-btn.-primary {

        padding: 12px;
        font-size: 15px;
        margin-top: var(--sp-1);
      }

      .leg-separator { margin-left: var(--sp-3); }
      .seats-warning { margin-left: var(--sp-3); }
      .alt-times { margin-left: var(--sp-3); }
    }

    @media (min-width: 768px) {
      .leg-content { gap: var(--sp-4); }
      .time-hour { font-size: 22px; }
    }
  </style>
</head>

  { pill: 'Clima', title: 'Clima en tu destino', body: 'En Mendoza en octubre las temperaturas oscilan entre 15 °C y 25 °C. Llevá ropa ligera y una chaqueta para las noches.', cta: null },
  { pill: 'Imperdible', title: 'Qué tenés que conocer', body: 'No te pierdas la Cordillera de los Andes. Sus paisajes son impresionantes y perfectos para fotos inolvidables.', cta: null },
  { pill: 'Temporada', title: 'Precios en el destino', body: 'En octubre, Mendoza está en temporada media. Los precios son accesibles — probá un asado en el centro.', cta: null },
  { pill: 'Tu viaje', title: 'Sobre tu viaje', body: 'Mendoza te espera con viñedos, montañas y una gastronomía exquisita. ¡Preparate para una experiencia inolvidable!', cta: null }
];

/* ──────────────────────────────────────────────
   SVG ICON HELPERS (EVA UI icon style, stroke-based)
   ────────────────────────────────────────────── */
function svgIcon(name, size) {
  const s = size || 16;
  const base = `width="${s}" height="${s}" viewBox="0 0 ${s} ${s}" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true" style="display:inline-block;vertical-align:middle;flex-shrink:0;"`;

  const icons = {
    backpack: `<svg ${base} stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round">
      <path d="M6 6V4.5a2 2 0 0 1 4 0V6"/>
      <rect x="3" y="6" width="10" height="9" rx="1.5"/>
      <path d="M5.5 10.5h5"/>
    </svg>`,

    suitcase: `<svg ${base} stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round">
      <path d="M5.5 5V3.5a1 1 0 0 1 1-1h3a1 1 0 0 1 1 1V5"/>
      <rect x="2" y="5" width="12" height="9" rx="1.5"/>
      <line x1="2" y1="9.5" x2="14" y2="9.5"/>
    </svg>`,

    loyalty: `<svg ${base} stroke="currentColor" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round">
      <path d="M8 2l1.6 3.25 3.6.52-2.6 2.54.61 3.59L8 10.27l-3.21 1.63.61-3.59-2.6-2.54 3.6-.52z"/>
    </svg>`,

    warning: `<svg ${base} stroke="currentColor" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round">
      <path d="M7 1.5L13.5 13H.5L7 1.5Z"/>
      <line x1="7" y1="5.5" x2="7" y2="8.5"/>
      <circle cx="7" cy="10.5" r="0.6" fill="currentColor" stroke="none"/>
    </svg>`,

    gift: `<svg ${base} stroke="currentColor" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round">
      <rect x="2" y="6" width="12" height="8" rx="1"/>
      <line x1="8" y1="6" x2="8" y2="14"/>
      <path d="M5.5 6C5.5 4.3 6.5 3.5 8 4c1 .33 1.5 1.5 0 2"/>
      <path d="M10.5 6C10.5 4.3 9.5 3.5 8 4c-1 .33-1.5 1.5 0 2"/>
    </svg>`
  };

  return icons[name] || '';
}

/* ──────────────────────────────────────────────
   RENDER HELPERS
   ────────────────────────────────────────────── */
function airlineBadge(airline) {
  return `<div class="airline-badge" style="background:${airline.bg}22;color:${airline.fg === '#fff' ? airline.bg : airline.fg};">
    ${airline.code}
  </div>`;
}

function renderLeg(leg, airline, direction) {
  const stopsDot = leg.stops > 0 ? `<div class="t-stop-dot"></div>` : '';
  const stopsClass = leg.stops === 0 ? '-direct' : '-stop';
  const stopsLabel = leg.stops === 0 ? 'Directo' : `${leg.stops} escala${leg.stops > 1 ? 's' : ''}${leg.stopCity ? ' en ' + leg.stopCity : ''}`;

  const seatsWarning = leg.seats <= 5
    ? `<div class="seats-warning">${svgIcon('warning', 13)} Solo quedan ${leg.seats} asientos</div>`
    : '';

  const altsHtml = leg.alternatives && leg.alternatives.length > 0
    ? `<div class="alt-times">
        <span class="alt-label">Otro horario:</span>
        ${leg.alternatives.map(a =>
          `<button class="alt-btn" onclick="selectAlt(event,'${a.depTime}','${a.arrTime}')">${a.depTime} – ${a.arrTime} <span style="font-size:10px;opacity:.7;">(${a.seats} asientos)</span></button>`
        ).join('')}
      </div>`
    : '';

  const diffNote = (leg.depDiff || leg.arrDiff)
    ? `<div style="margin-left:44px;margin-top:var(--sp-1);font-size:11px;color:var(--color-warning-500);font-weight:600;display:flex;align-items:center;gap:4px;">${svgIcon('warning', 13)} Aeropuerto diferente al de búsqueda</div>`
    : '';

  return `
    <div class="flight-leg">
      ${airlineBadge(airline)}
      <div class="leg-content">
        <div class="time-block">
          <div class="time-hour">${leg.depTime}</div>
          <div class="time-airport${leg.depDiff ? ' -alt' : ''}">${leg.depAirport}</div>
        </div>

        <div class="leg-timeline">
          <div class="leg-meta">
            <span class="meta-duration">${leg.duration}</span>
            <span class="meta-stops ${stopsClass}">${stopsLabel}</span>
          </div>
          <div class="timeline-track">
            <div class="t-dot"></div>
            <div class="t-line">${stopsDot}</div>
            <div class="t-dot"></div>
          </div>
        </div>

        <div class="time-block">
          <div class="time-hour">${leg.arrTime}</div>
          <div class="time-airport${leg.arrDiff ? ' -alt' : ''}">${leg.arrAirport}</div>
        </div>
      </div>
    </div>
    ${diffNote}
    ${seatsWarning}
    ${altsHtml}
  `;
}

function renderBaggage(b) {
  return `<div class="baggage-row">
    <span class="bag-item">${svgIcon('backpack')} Mochila</span>
    ${b.checked > 0
      ? `<span class="bag-item">${svgIcon('suitcase')} 1 valija 23 kg</span>`
      : `<span class="bag-item -off">${svgIcon('suitcase')} Sin valija</span>`
    }
    ${b.carryOn
      ? `<span class="bag-item">${svgIcon('suitcase')} Carry-on</span>`
      : ``
    }
  </div>`;
}

function renderFlightCard(f) {
  const suggestedTag = f.suggested
    ? `<div class="suggested-tag">
        <svg width="12" height="12" viewBox="0 0 12 12" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true" style="flex-shrink:0;">
          <circle cx="6" cy="6" r="5" stroke="currentColor" stroke-width="1.2"/>
          <path d="M3.5 6l1.8 1.8L8.5 4" stroke="currentColor" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
        Sugerido
      </div>`
    : '';

  const topBadge = f.promoted ? `
    <div class="card-top-badge">
      <span class="badge-promoted">Promocionado</span>
      ${f.promoLabel ? `<span class="badge-promo-pill">${svgIcon('gift', 12)} ${f.promoLabel}</span>` : ''}
    </div>` : '';

  const discountChip = f.discount
    ? `<div class="price-discount-chip">${f.discount}</div>` : '';

  const origPrice = f.priceOrig
    ? `<div class="price-original">${f.priceOrig}</div>` : '';

  const loyaltyLine = f.frequentFlyer
    ? `<div class="loyalty-line">${svgIcon('loyalty')} ${f.frequentFlyer}</div>`
    : f.loyalty
    ? `<div class="loyalty-line">${svgIcon('loyalty')} Sumás ${f.loyalty} pts Club Despegar</div>`
    : '';

  return `
    <article class="flight-card${f.suggested ? ' -suggested' : ''}" onclick="openFlight(${f.id})" role="button" aria-label="Seleccionar vuelo ${f.id}">
      ${suggestedTag}
      ${topBadge}
      <div class="card-body">
        ${renderLeg(f.out, f.airlines.out, 'Ida')}

        <div class="leg-separator">
          <div class="sep-line"></div>
          <span class="sep-label">Regreso · 25 oct</span>
          <div class="sep-line"></div>
        </div>

        ${renderLeg(f.ret, f.airlines.ret, 'Vuelta')}
      </div>

      <div class="card-divider"></div>

      <div class="card-footer">
        <div class="footer-left">
          ${renderBaggage(f.baggage)}
          ${loyaltyLine}
          <div class="stay-line">Disfrutá ${f.stayDays} días en Mendoza</div>
        </div>

        <div class="price-box">
          ${discountChip}
          ${origPrice}
          <div class="price-main">${f.price}</div>
          <div class="price-sub">2 personas · ${f.pricePer}</div>
          <div class="price-bank">Hasta ${f.installments} cuotas · ${f.bank}</div>
          <button class="eva-3-btn -primary" onclick="event.stopPropagation(); openFlight(${f.id})">
            Seleccionar
          </button>
        </div>
      </div>
    </article>
  `;
}

/* ──────────────────────────────────────────────
   TIPS CARD
   ────────────────────────────────────────────── */
let activeTip = 0;

function renderTipsCard() {
  return `
    <div class="tips-card">
      <div class="tips-header">Sobre tu viaje a Mendoza</div>
      <div class="tips-pills" id="tips-pills">
        ${TIPS.map((t, i) => `
          <button class="tip-pill${i === 0 ? ' -active' : ''}" onclick="selectTip(${i})">${t.pill}</button>
        `).join('')}
      </div>
      <div class="tip-content" id="tip-content">
        <div class="tip-content-title">${TIPS[0].title}</div>
        <div class="tip-content-body">${TIPS[0].body}</div>
        ${TIPS[0].cta ? `<button class="tip-cta">→ ${TIPS[0].cta}</button>` : ''}
      </div>
    </div>
  `;
}

function selectTip(i) {
  activeTip = i;
  document.querySelectorAll('.tip-pill').forEach((el, idx) => {
    el.classList.toggle('-active', idx === i);
  });
  const area = document.getElementById('tip-content');
  const t = TIPS[i];
  area.innerHTML = `
    <div class="tip-content-title">${t.title}</div>
    <div class="tip-content-body">${t.body}</div>
    ${t.cta ? `<button class="tip-cta">→ ${t.cta}</button>` : ''}
  `;
  area.style.animation = 'none';
  area.offsetHeight;
  area.style.animation = '';
}

/* ──────────────────────────────────────────────
   ACTIONS
   ────────────────────────────────────────────── */
function openFlight(id) {
  const f = FLIGHTS.find(f => f.id === id);
  if (!f) return;
  const msg = `Seleccionaste:\n${f.airlines.out.name} · Ida ${f.out.depAirport} ${f.out.depTime} → ${f.out.arrTime}\nVuelta ${f.ret.depAirport} ${f.ret.depTime} → ${f.ret.arrTime}\n\nPrecio: ${f.price} (2 personas)`;
  alert(msg);
}

function selectAlt(event, depTime, arrTime) {
  event.stopPropagation();
  alert(`Seleccionaste horario alternativo: ${depTime} – ${arrTime}`);
}

/* ──────────────────────────────────────────────
   INIT
   ────────────────────────────────────────────── */
function render() {
  document.getElementById('results-count').textContent = `${FLIGHTS.length} opciones encontradas`;

  const list = document.getElementById('flights-list');
  list.innerHTML =
    renderFlightCard(FLIGHTS[0]) +
    renderTipsCard() +
    renderFlightCard(FLIGHTS[1]) +
    renderFlightCard(FLIGHTS[2]);
}

render();
</script>

</body>
</html>
